# Reverse-proxy vhost for the private preview, for the DROPLET's Apache —
# not the container's. Copy to /etc/apache2/sites-available/ and edit
# ServerName.
#
# This file only ever ADDS a vhost. It does not disable, edit or reference the
# portfolio's vhost, and there is no a2dissite anywhere in the procedure. That
# is the whole reason for running the site in a container on this host rather
# than installing it alongside.
#
# Needs: a2enmod proxy proxy_http headers
#
# certbot --apache will read this, generate the :443 vhost from it and add the
# http -> https redirect. Run certbot AFTER this is enabled and DNS resolves.

<VirtualHost *:80>
    ServerName abyss.example.com

    # Let's Encrypt's HTTP-01 challenge must be served by THIS Apache from its
    # own webroot, never forwarded to the container, and never put behind the
    # password. Both exclusions have to come before the catch-all ProxyPass:
    # first match wins, so ordering here is load-bearing.
    ProxyPass /.well-known/acme-challenge/ !

    <Location "/.well-known/acme-challenge/">
        AuthType None
        Require all granted
    </Location>

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # WordPress is pinned to https://<domain> but receives plain HTTP from this
    # proxy, so it needs telling. Paired with BEHIND_TLS_PROXY=1 in
    # provision.sh, which adds the matching check to wp-config.php.
    #
    # `set`, not `setifempty`: this overwrites whatever the client sent, so a
    # visitor cannot assert their own connection was secure.
    RequestHeader set X-Forwarded-Proto "https"

    # The preview is not public. noindex asks crawlers that honour it to stay
    # away; this stops everyone else, and it is the part that actually holds.
    # It matters more than it sounds: issuing a certificate for this hostname
    # publishes it in Certificate Transparency logs, which are scraped
    # continuously, so the URL becomes public knowledge within minutes of the
    # certificate being issued whether or not it is ever linked.
    <Location />
        AuthType Basic
        AuthName "The-abyss (private preview)"
        AuthUserFile /etc/apache2/.abyss-htpasswd
        Require valid-user
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/abyss-error.log
    CustomLog ${APACHE_LOG_DIR}/abyss-access.log combined
</VirtualHost>
